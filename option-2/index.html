<!doctype html>
<html lang="en" dir="ltr" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DMS Developer Network</title>
  <script>
    try { var t = localStorage.getItem('ddn-theme-2'); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&family=Readex+Pro:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="../assets/styles.css">
  <link rel="stylesheet" href="option-2.css">
</head>
<body data-option="2">
  <header class="top">
    <div class="top-row">
      <a class="logo" href="#/home" aria-label="DMS Developer Network">
        <!-- Redrawn from the supplied logo; swap for the official SVG when available -->
        <svg class="logo-mark" viewBox="0 0 32 32" aria-hidden="true">
          <g transform="rotate(45 16 16)">
            <rect x="5" y="5" width="10.4" height="10.4" fill="#e3262b"/>
            <rect x="16.6" y="5" width="10.4" height="10.4" fill="#0e7a3f"/>
            <rect x="5" y="16.6" width="10.4" height="10.4" fill="#f2e41e"/>
            <rect x="16.6" y="16.6" width="10.4" height="10.4" fill="#0c4a70"/>
          </g>
        </svg>
        <b>DMS</b><span data-i18n="brandSub"></span>
      </a>
      <nav id="nav" aria-label="Main"></nav>
      <form class="cmd" data-form="search" role="search">
        <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M11 4a7 7 0 1 0 0 14 7 7 0 0 0 0-14zM20 20l-4-4"/></svg>
        <input type="search" name="q" data-i18n-ph="search" aria-label="Search">
        <kbd>/</kbd>
      </form>
      <button class="btn ghost icon" data-act="theme" aria-label="Toggle theme" data-theme-ico></button>
      <button class="btn ghost" data-act="lang" data-lang-label></button>
      <a class="btn primary console" href="#/dashboard"><span data-i18n="console"></span></a>
    </div>
  </header>

  <main id="view"></main>

  <footer class="site-foot">
    <span>© 2026 Data Management Systems SAE</span><span><span data-i18n="footer"></span> · <a class="link" href="../index.html" data-i18n="options"></a></span>
  </footer>

  <script src="../assets/data.js"></script>
  <script src="../assets/app.js"></script>
</body>
</html>
